# Production configuration for Render
spring.application.name=vari-backend

# Server configuration - Render provides PORT environment variable
server.port=${PORT:8080}

# Database configuration is handled by RenderDatabaseConfig
# which reads DATABASE_URL environment variable and parses it properly
spring.datasource.driver-class-name=org.postgresql.Driver

# Initialize database schema from schema.sql on startup
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:schema.sql

# JPA Configuration
# Use 'validate' to just validate the schema exists (schema is created by schema.sql)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Connection pool settings (optimized for Render)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.initialization-fail-timeout=0

# CORS - Allow all origins for mobile app access
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Health check endpoint for Render
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Logging
logging.level.root=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.boot=INFO