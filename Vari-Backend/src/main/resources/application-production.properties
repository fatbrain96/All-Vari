# Production configuration for Render
spring.application.name=vari-backend

# Server configuration - Render provides PORT environment variable
server.port=${PORT:8080}

# Database configuration is handled by DataSourceConfig class
# which reads DATABASE_URL environment variable and converts it to JDBC format
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# CORS - Allow all origins for mobile app access
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Health check endpoint for Render
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always