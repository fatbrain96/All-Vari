# Production configuration for Railway
spring.application.name=vari-backend

# Server configuration - Railway provides PORT environment variable
server.port=${PORT:8080}

# Database - Your existing Supabase PostgreSQL (no changes needed!)
spring.datasource.url=jdbc:postgresql://db.xyz.supabase.co:6543/postgres?prepareThreshold=0
spring.datasource.username=postgres.lwqkvblnvpalvrefnnnv
spring.datasource.password=AsthaTrivedi
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Connection pool settings (optimized for Railway)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# CORS - Allow all origins for mobile app access
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Health check endpoint for Railway
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always