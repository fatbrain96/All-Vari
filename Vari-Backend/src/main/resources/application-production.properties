# Production configuration for Render
server.port=${PORT:8080}

# Database - Use your working Supabase PostgreSQL
spring.datasource.url=jdbc:postgresql://db.lwqkvblnvpalvrefnnnv.supabase.co:5432/postgres?sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=AsthaTrivedi

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-timeout=30000

# CORS - Allow your Flutter app to connect
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Health check endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always