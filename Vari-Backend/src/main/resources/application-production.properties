# Production configuration for Render
spring.application.name=vari-backend

# Server configuration - Render provides PORT environment variable
server.port=${PORT:8080}

# Database - Use Render's PostgreSQL database
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration - Let Hibernate auto-detect dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Connection pool settings (optimized for Render)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# CORS - Allow all origins for mobile app access
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Health check endpoint for Render
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always